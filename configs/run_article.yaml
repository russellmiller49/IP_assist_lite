doc_type: article
profile: enriched
second_pass: auto
engines:
  - pymupdf
  - pdfplumber
ocr:
  enable: false

metadata_sources:
  zotero_json: "data/zotero/my_library.json"

enrichment:
  use_zotero: true
  min_title_match: 0.90
  prefer_doi: true

thresholds:
  guideline:
    min_recommendations: 8
    grade_density: 0.7
    min_sections: 1
  statement:
    require_yield_definitions: true
    min_sections: 1
  classification:
    min_sections: 1
  research:
    min_sections: 4
    min_chars: 25000
    require_diagnostic_yield: true

size_guards:
  max_evidence_per_item: 5
  max_chars_per_evidence: 2000
  max_tables: 50
  max_table_cells: 5000
  max_sections: 60
  max_paragraph_chars: 3000
  keep_table_types:
    - diagnostic_accuracy
    - baseline
    - complications
    - yield
    - outcomes

emit:
  evidence_policy: compact
  tables_mode: compact
  evidence_max_chars: 600
  table_cell_max_chars: 800
  paragraph_store: true
  max_entities: 3000
  max_relations: 15000
  max_relations_per_pair: 6
  relation_mode: compact
  relation_window: 80
  keep_evidence_bank: true
  max_tables: 10
  max_json_bytes: 10000000

text_normalization:
  enabled: true

tables:
  sterilization_hints:
    enabled: false

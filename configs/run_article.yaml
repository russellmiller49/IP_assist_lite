doc_type: article
profile: enriched
engines:
  - pymupdf
  - pdfplumber
ocr:
  enable: false

thresholds:
  guideline:
    min_recommendations: 8
    min_sections: 1
    min_chars: 30000
    min_grade_density: 0.7
    require_diagnostic_yield: false
  research:
    min_sections: 4
    min_chars: 25000
    require_diagnostic_yield: true

size_guards:
  max_evidence_per_item: 5
  max_chars_per_evidence: 2000
  max_tables: 50
  max_table_cells: 5000
  max_sections: 60
  max_paragraph_chars: 3000
  keep_table_types:
    - diagnostic_accuracy
    - baseline
    - complications
    - yield
    - outcomes

emit:
  evidence_policy: compact
  tables_mode: compact
  evidence_max_chars: 360
  table_cell_max_chars: 800
  paragraph_dedupe: true
  max_entities: 3000
  max_relations: 40000
  relation_window: 80
  keep_evidence_bank: true
  max_tables: 24
  max_json_bytes: 10000000

doc_type: ifu
profile: enriched
second_pass: auto
engines:
  - pymupdf
  - pdfplumber

extract:
  backend: legacy        # legacy | docling
  long_doc:
    streaming: true
    pages_per_batch: 40
    per_page_timeout_s: 10

tables:
  mode: fast
  max_tables: 24
  sterilization_hints:
    enabled: true

docling:
  enabled: false
  selective_pages: true
  force_pages: []

chunking:
  method: smart
  column_mode: auto
  overlap_ratio: 0.10

umls:
  post_filter: strict

thresholds:
  default:
    min_chars_abs: 10000
    strict_front_matter: false
  "Intuitive Surgical":
    min_chars_abs: 150000
    strict_front_matter: true

size_guards:
  max_evidence_per_item: 3
  max_chars_per_evidence: 1200
  max_tables: 24  # tables.max_tables: keep IFU tables cap at 24
  max_table_cells: 3000
  max_sections: 40
  max_paragraph_chars: 2000

emit:
  evidence_policy: compact
  tables_mode: compact
  evidence_max_chars: 500
  table_cell_max_chars: 600
  paragraph_store: true
  max_entities: 3000
  max_relations: 15000
  relation_window: 80
  keep_evidence_bank: true
  max_tables: 24

text_normalization:
  enabled: true


ifu:
  small_ifu_threshold: 4
  small_leaflet_policy: map_intended_use_to_indications
  ifu_engine: hybrid
  extract:
    long_doc:
      streaming: true          # enable streaming fallback for ≥ page_threshold pages
      per_page_timeout_s: 10   # throttles per-batch runtime; metrics capture batches_failed on timeout
      page_threshold: 250
      pages_per_batch: 40
      max_failed_batches: 4
  engine_overrides:
    intuitive: pymupdf
    erbe: pdfplumber
    olympus: pymupdf
  fast_long_docs: true
  long_doc_page_threshold: 80
  fast_long_engine: pymupdf
  engine:
    mode: auto
    text: pymupdf
    tables: pdfplumber
    auto:
      sample_pages: 6
      char_density_threshold: 1400
      image_density_threshold: 0.6
      large_doc_pages: 90
      prefer: pymupdf
      fallback: pdfplumber
      timeouts:
        pymupdf: 240
        pdfplumber: 210
  anchors:
    indications_for_use:
      start:
        - "indications for use"
      stops:
        - "intended use"
        - "intended user"
        - "contraindications"
        - "warnings"
  toc_guard:
    enabled: true
    density_threshold: 0.65
    dot_leader_min: 0.20
    page_number_ratio: 0.40
  manufacturer_overrides:
    "INTUITIVE SURGICAL, INC.":
      toc_guard:
        density_threshold: 0.55
        dot_leader_min: 0.15  # More aggressive for Ion's index pages
      strict_anchors: true  # Use strict section boundaries
      require_cover_metadata: true  # Require PN/Rev/Model from cover
      min_anchor_page: 10
    "INTUITIVE SURGICAL":  # Alternate name matching
      toc_guard:
        density_threshold: 0.55
        dot_leader_min: 0.15
      strict_anchors: true
      require_cover_metadata: true
      min_anchor_page: 10
    "OLYMPUS":
      recognize_important_info_block: true
      small_ifu_fallback: true  # For 2-4 page leaflets like BW 18V
    "OLYMPUS CORPORATION":
      recognize_important_info_block: true
      small_ifu_fallback: true
  safety:
    booster:
      dedupe_ratio: 0.92
      max_added: 20
  safety_typing:
    enabled: true

doc_type: ifu
profile: enriched
engines:
  - pdfplumber
  - pymupdf

thresholds:
  default:
    min_chars_abs: 10000
    strict_front_matter: false
  "Intuitive Surgical":
    min_chars_abs: 150000
    strict_front_matter: true

size_guards:
  max_evidence_per_item: 3
  max_chars_per_evidence: 1200
  max_tables: 30
  max_table_cells: 3000
  max_sections: 40
  max_paragraph_chars: 2000

emit:
  evidence_policy: compact
  tables_mode: compact
  evidence_max_chars: 500
  table_cell_max_chars: 600
  paragraph_store: true
  max_entities: 3000
  max_relations: 15000
  relation_window: 80
  keep_evidence_bank: true
  max_tables: 10

ifu:
  anchors:
    indications_for_use:
      start:
        - "indications for use"
      stops:
        - "intended use"
        - "intended user"
        - "contraindications"
        - "warnings"
  toc_guard:
    enabled: true
    density_threshold: 0.65
    dot_leader_min: 0.20
    page_number_ratio: 0.40
  manufacturer_overrides:
    "INTUITIVE SURGICAL, INC.":
      toc_guard:
        density_threshold: 0.55

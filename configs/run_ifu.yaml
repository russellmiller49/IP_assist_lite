doc_type: ifu
profile: enriched
engines:
  - pdfplumber
  - pymupdf

thresholds:
  default:
    min_chars_abs: 10000
    strict_front_matter: false
  "Intuitive Surgical":
    min_chars_abs: 150000
    strict_front_matter: true

size_guards:
  max_evidence_per_item: 3
  max_chars_per_evidence: 1200
  max_tables: 30
  max_table_cells: 3000
  max_sections: 40
  max_paragraph_chars: 2000

emit:
  evidence_policy: compact
  tables_mode: compact
  evidence_max_chars: 360
  table_cell_max_chars: 600
  paragraph_dedupe: true
  max_entities: 3000
  max_relations: 20000
  relation_window: 80
  keep_evidence_bank: true
  max_tables: 24

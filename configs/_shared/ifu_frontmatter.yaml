manufacturers:
  - name: "ERBE Elektromedizin GmbH"
    patterns:
      - 'ERBE\s+Elektromedizin\s+GmbH'
      - 'ERBE\s+Medical'
      - 'ERBE\s+USA'
      - 'ERBE\s+Austria'
      - 'erbe\.(?:com|de|at)'
  - name: "Intuitive Surgical, Inc."
    patterns:
      - 'Intuitive\s+Surgical'
      - 'Ion(?:™)?\s+Endoluminal\s+System'
      - 'Intuitive\s+Surgical\s+SARL'
      - 'Intuitive\s+Ib[eé]rica'
      - 'Intuitive\s+Operations'
      - '©\s*Intuitive'
      - 'intuitive\.(?:com|co\.uk|eu)'
  - name: "Olympus Corporation"
    patterns:
      - 'Olympus\s+Corporation'
      - 'Olympus\s+America\s+Inc\.'
      - 'Olympus\s+Medical'
      - 'Olympus\s+KeyMed'
      - 'olympus\.(?:com|co\.jp|eu)'

product_patterns:
  "ERBE Elektromedizin GmbH":
    - regex: '(?i)(System\s*Carrier.*)'
      group: 1
    - regex: '(?i)(SystemCarrier.*)'
      group: 1
    - regex: '(?i)(Units and Modules.*)'
      group: 1
    - regex: '(?i)product\s+name[:\-]\s*(.+)'
      group: 1
  "Intuitive Surgical, Inc.":
    - regex: '(?i)(Ion\s+Endoluminal\s+System.*)'
      group: 1
    - regex: '(?i)(Ion\s+System\s+Instruments?.*)'
      group: 1
  "Olympus Corporation":
    - regex: '(?i)(ALT[\s\-]?PRO\s+.*)'
      group: 1
    - regex: '(?i)(BW[\s\-]?18V\s+.*)'
      group: 1
    - regex: '(?i)(EVIS\s+EUS\s+Endoscopic\s+Ultrasound\s+Center.*)'
      group: 1
    - regex: '(?i)(Olympus\s+EU[\s\-]?ME\s*3.*)'
      group: 1
    - regex: '(?i)(System\s+Carrier.*)'
      group: 1
    - regex: '(?i)(Units and Modules.*)'
      group: 1
    - regex: '(?i)(Safety\s+Precautions?.*)'
      group: 1
  default:
    - regex: '(?i)([A-Z][A-Za-z0-9\-/ ]{4,})'
      group: 1

product_name_from_filename: true

print_code_patterns:
  - "GR\\s*\\d{3,5}\\s*\\d{1,2}"

pattern_bundle:
  manufacturers:
    - "(?i)Intuitive Surgical"
    - "(?i)ERBE(?:\\s+Elektromedizin)?"
    - "(?i)Olympus"
    - "(?i)intuitive\\.(?:com|co\\.uk|eu)"
    - "(?i)olympus\\.(?:com|co\\.jp|eu)"
    - "(?i)erbe\\.(?:com|de|at)"
  product_name:
    - "(?i)(Ion Endoluminal System)"
    - "(?i)(System Carrier)"
    - "(?i)(ALT[- ]?Pro)"
    - "(?i)(BW[- ]?18V)"
  part_number:
    - "(?i)(?:Part No\\.?|P/N|PN|REF|Order No\\.?|Document ID|Doc ID|Catalog(?:ue)? No\\.?)\\s*[:#]?\\s*([A-Z0-9\\-\\.]+)"
    - "(?i)Order\\s*(?:No\\.?|Number)\\s*[:#]?\\s*([A-Z0-9\\-\\.]+)"
    - "(?i)REF\\s*[:#]?\\s*([A-Z0-9\\-\\.]+)"
  revision:
    - "(?i)(?:Rev(?:ision)?\\.?|Version|Revision\\s*(?:Level|Code))\\s*[:#]?\\s*([A-Z0-9\\-\\.]+)"
  publication_date:
    - "(?i)(?:Published|Issue(?:d)?|Date|Revision Date|Release Date)\\s*[:#]?\\s*([0-9]{4}[-/][0-9]{2}[-/][0-9]{2})"
    - "(?i)(?:Published|Issue(?:d)?|Date)\\s*[:#]?\\s*([A-Za-z]{3,9}\\s+\\d{4})"
    - "(?i)(January|February|March|April|May|June|July|August|September|October|November|December)\\s+(\\d{4})"
    - "(?i)(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Sept|Oct|Nov|Dec)\\.?,?\\s+(\\d{4})"
  model:
    - "(?i)Model\\s*[:#]?\\s*([A-Z0-9\\-]+)"
    - "(?i)(BW[- ]?18V)"
    - "(?i)(ALT[- ]?Pro)"

doc_type: textbook
profile: enriched
engines:
  - pymupdf
  - pdfplumber

metadata_sources:
  zotero_json: "data/zotero/my_library.json"

enrichment:
  use_zotero: true
  min_title_match: 0.90
  prefer_doi: true

thresholds:
  min_coverage_ratio: 0.80

size_guards:
  max_evidence_per_item: 3
  max_chars_per_evidence: 1200
  max_tables: 40
  max_table_cells: 4000
  max_sections: 50
  max_paragraph_chars: 2000

emit:
  evidence_policy: compact
  tables_mode: compact
  evidence_max_chars: 360
  table_cell_max_chars: 700
  paragraph_dedupe: true
  max_entities: 3000
  max_relations: 40000
  max_relations_per_pair: 6
  relation_mode: compact
  relation_window: 80
  keep_evidence_bank: true
  max_tables: 24

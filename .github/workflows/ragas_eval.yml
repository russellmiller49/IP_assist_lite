name: ragas-regression
on: [pull_request]
jobs:
  eval:
    runs-on: ubuntu-latest
    services:
      qdrant:
        image: qdrant/qdrant:v1.9.0
        ports: ["6333:6333"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Install deps
        run: |
          pip install -r requirements.txt
          python -m spacy download en_core_web_sm || true
      - name: Build v2 index
        env: { QDRANT_HOST: localhost, QDRANT_PORT: 6333 }
        run: python -m src.index.build_index_v2
      - name: Validate vignette coverage
        run: python scripts/validate_vignettes.py
      - name: RAGAS + Numeric checks
        env:
          TH_F: "0.75"
          TH_AR: "0.70"
          TH_CR: "0.70"
          NUM_TOL: "5.0"
          ALLOW_GAUGE_OFF_BY_ONE: "true"
        run: python scripts/run_ragas_eval.py
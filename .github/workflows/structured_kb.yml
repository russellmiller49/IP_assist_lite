name: structured-kb

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      SKIP_LEGACY_GOLDENS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: pytest -q
      - run: |
          if [ -d "data/structured_knowledge/diseases" ]; then
            python -m src.prep.kb_validate
          else
            echo "No structured knowledge data found - skipping validation"
          fi

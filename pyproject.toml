[build-system]
requires = ["setuptools>=67", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ip-assist-lite"
version = "0.1.0"
description = "End-to-end medical PDF parsing and normalization pipeline."
readme = "README.md"
requires-python = ">=3.11,<3.14"
authors = [{name = "Medparse Team"}]
dependencies = [
    "pydantic>=2.0.0",
    "PyMuPDF==1.24.9",
    "pdfplumber==0.11.7",
    "regex>=2023.0.0",
    "rapidfuzz>=3.0.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3,<1.8",  # Compatible with wheels, avoid source builds
    "torch>=2.0.0",
    "typer>=0.9.0,<0.10",  # spaCy 3.7.4 requires <0.10
    "rich>=13.0.0",
    "tqdm>=4.65.0",
    "hypothesis>=6.82.0",
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "python-dateutil>=2.8.2",
    "fastapi>=0.110.0",
    "jsondiff>=2.0.0",
    "qdrant-client>=1.8,<1.16",
    "spacy>=3.7.3,<3.8.0",
    "scipy<1.11",  # Required by scispacy 0.5.4
]

[project.optional-dependencies]
dev = [
    "black>=24.0.0",
    "ruff>=0.4.0",
    "isort>=5.12.0",
    "mypy>=1.8.0",
    "pre-commit>=3.6.0",
]
graph = [
    "neo4j>=5.20",
]
enriched = [
    # UMLS linking and biomedical NLP
    "scispacy==0.5.4",
    "nmslib>=2.1.1",
    # Note: scispaCy model must be installed separately:
    # pip install https://s3-us-west-2.amazonaws.com/ai2-s2-scispacy/releases/v0.5.4/en_core_sci_lg-0.5.4.tar.gz
]

[tool.setuptools.packages.find]
where = ["."]
include = ["medparse*", "src*"]

[tool.black]
line-length = 100
target-version = ["py310", "py311"]

[tool.isort]
profile = "black"
line_length = 100
combine_as_imports = true

[tool.ruff]
line-length = 100
target-version = "py310"
lint.select = ["E", "F", "I", "UP", "B", "A", "TID", "RUF"]
lint.ignore = ["E203", "E501"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "--strict-config --strict-markers --cov=adapters --cov=jobs --cov=graph --cov=normalize --cov-report=xml --cov-report=term-missing"
testpaths = ["tests/unit", "tests/integration"]
filterwarnings = [
    "error::UserWarning:medparse\\..*",
    "ignore::UserWarning:pdfminer\\..*",
    "ignore::UserWarning:pdfplumber\\..*",
    "ignore:Importing 'parser.split_arg_string':DeprecationWarning:spacy.cli._util",
    "ignore:Importing 'parser.split_arg_string':DeprecationWarning:weasel.util.config",
]

[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
exclude_lines = [
    "if TYPE_CHECKING:",
]
fail_under = 80

[project.scripts]
ipa_ingest = "jobs.ingest_documents:main"
medparse = "medparse.cli:run"

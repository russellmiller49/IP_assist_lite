[build-system]
requires = ["setuptools>=67", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "medparse"
version = "0.1.0"
description = "End-to-end medical PDF parsing and normalization pipeline."
readme = "README.md"
requires-python = ">=3.11,<3.13"
authors = [{name = "Medparse Team"}]
dependencies = [
    "pydantic>=2.0.0",
    "PyMuPDF>=1.23.0",
    "pdfplumber>=0.11.0",
    "regex>=2023.0.0",
    "rapidfuzz>=3.0.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "tqdm>=4.65.0",
    "hypothesis>=6.82.0",
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "python-dateutil>=2.8.2",
    "fastapi>=0.110.0",
    "jsondiff>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "black>=24.0.0",
    "ruff>=0.4.0",
    "isort>=5.12.0",
    "mypy>=1.8.0",
    "pre-commit>=3.6.0",
]

[tool.black]
line-length = 100
target-version = ["py310", "py311"]

[tool.isort]
profile = "black"
line_length = 100
combine_as_imports = true

[tool.ruff]
line-length = 100
target-version = "py310"
lint.select = ["E", "F", "I", "UP", "B", "A", "TID", "RUF"]
lint.ignore = ["E203", "E501"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "--strict-config --strict-markers --cov=medparse --cov-report=xml --cov-report=term-missing"
testpaths = ["tests/unit", "tests/integration"]
filterwarnings = [
    "error::UserWarning:medparse\\..*",
    "ignore::UserWarning:pdfminer\\..*",
    "ignore::UserWarning:pdfplumber\\..*",
    "ignore:Importing 'parser.split_arg_string':DeprecationWarning:spacy.cli._util",
    "ignore:Importing 'parser.split_arg_string':DeprecationWarning:weasel.util.config",
]

[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
exclude_lines = [
    "if TYPE_CHECKING:",
]
fail_under = 80
